[package]
name = "memoryclip"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
fs2 = "0.4.3"
hkdf = "0.13.0"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
rand = "0.10.3"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.0"

[package.metadata.deb]
maintainer = "Tran Minh Ta <your-email@example.com>"
copyright = "2026, Tran Minh Ta"
extended-description = "Tự động theo dõi clipboard và quản lý lịch sử với SQLite FTS5"
section = "utility"
priority = "optional"
assets = [
    ["target/release/memoryclip", "usr/bin/memoryclip", "755"],
]
